name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build
        run: pip install build
      - name: Build dist
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          python -c "
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          pattern = rf'## \[{re.escape(version)}\](.*?)(?=## \[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(1).strip() if match else 'Release ' + version)
          " "$VERSION" > release_notes.md
      - name: Detect prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v0\. ]] || [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            ${{ steps.pre.outputs.prerelease == 'true' && '--prerelease' || '' }}

  verify:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from PyPI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install "tmpkit==${VERSION}"
      - name: Smoke test
        run: python -c "from tmpkit import temp_file, temp_dir; print('ok')"
